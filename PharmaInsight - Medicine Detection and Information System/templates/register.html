<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register | MediScan PharmaInsight</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:linear-gradient(135deg,#eef4ff,#f0fffe);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 0;}
.wrap{width:100%;max-width:420px;padding:20px;}
.card{background:#fff;padding:36px 32px;border-radius:18px;box-shadow:0 25px 60px rgba(0,0,0,.12);text-align:center;}
.icon{width:70px;height:70px;background:linear-gradient(135deg,#1e88e5,#00bfa5);margin:0 auto 18px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;box-shadow:0 8px 24px rgba(30,136,229,.3);}
h2{font-size:24px;color:#0f172a;margin-bottom:5px;}
.sub{font-size:14px;color:#64748b;margin-bottom:22px;}
.msg{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;text-align:left;display:none;}
.msg.error{background:#fff0f0;color:#c62828;border:1px solid #fca5a5;display:block;}
.msg.success{background:#f0fdf4;color:#15803d;border:1px solid #86efac;display:block;}
.ig{position:relative;margin-bottom:13px;}
.ig i{position:absolute;top:50%;left:14px;transform:translateY(-50%);color:#94a3b8;}
.ig input{width:100%;padding:12px 38px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:14px;outline:none;transition:.2s;}
.ig input:focus{border-color:#1e88e5;box-shadow:0 0 0 3px rgba(30,136,229,.1);}
.cb{font-size:13px;text-align:left;margin:12px 0 18px;color:#64748b;}
.cb a{color:#1e88e5;text-decoration:none;}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#1e88e5,#00bfa5);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:.3s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,136,229,.3);}
.sw{margin-top:18px;font-size:14px;color:#64748b;}
.sw a{color:#1e88e5;text-decoration:none;font-weight:600;}
.back{text-align:center;margin-top:16px;}
.back a{color:#fff;background:rgba(30,136,229,.2);padding:8px 20px;border-radius:20px;text-decoration:none;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="icon"><i class="fa-solid fa-user-plus"></i></div>
    <h2>Create Account</h2>
    <p class="sub">Join MediScan for better health insights</p>

    {# Bug fix: uses Jinja error var from route instead of query-param JS hack #}
    {% if error %}
    <div class="msg error"><i class="fa fa-circle-exclamation"></i> {{ error }}</div>
    {% endif %}

    <form method="POST" action="/register">
      <div class="ig"><i class="fa fa-user"></i><input type="text" name="name" placeholder="Full name" required value="{{ request.form.get('name','') }}"></div>
      <div class="ig"><i class="fa fa-envelope"></i><input type="email" name="email" placeholder="Email address" required value="{{ request.form.get('email','') }}"></div>
      <div class="ig"><i class="fa fa-phone"></i><input type="tel" name="phone" placeholder="+91 XXXXX XXXXX" value="{{ request.form.get('phone','') }}"></div>
      <div class="ig"><i class="fa fa-lock"></i><input type="password" name="password" placeholder="Create password" required minlength="6"></div>
      <div class="ig"><i class="fa fa-lock"></i><input type="password" name="confirm_password" placeholder="Confirm password" required></div>
      <label class="cb"><input type="checkbox" required> I agree to the <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a></label>
      <button type="submit" class="btn"><i class="fa fa-user-plus"></i> Create Account</button>
    </form>
    <p class="sw">Already have an account? <a href="/login">Sign in</a></p>
  </div>
  <div class="back"><a href="/"><i class="fa fa-arrow-left"></i> Back to Home</a></div>
</div>
</body>
</html>
